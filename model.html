<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="/logo.ico">
<meta charset="UTF-8">
<title>Model Preview | TopNotch Assets</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Inter,system-ui,sans-serif;
}

/* ===== VIEWER ===== */
.viewer{height:75vh;background:#000}

/* ===== INFO BAR ===== */
.info-bar{
  height:90px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px;
  background:#020617;
  border-top:1px solid rgba(255,255,255,.08)
}

.meta h3{margin:0;font-size:20px}
.meta p{margin:4px 0 0;color:#94a3b8}

/* ===== ACTIONS ===== */
.actions{
  display:flex;
  gap:12px;
  align-items:center;
}

.action-btn{
  padding:12px 28px;
  border-radius:999px;
  border:none;
  font-weight:700;
  cursor:pointer;
}

#downloadBtn{
  background:linear-gradient(90deg,#00eaff,#6f7bff);
  color:#000;
}

#likeBtn{
  background:#111827;
  color:#fff;
  border:1px solid rgba(255,255,255,.15);
}
.like-btn.liked {
  background: linear-gradient(135deg,#ff4d4d,#ff7b7b);
  color:#000;
}

/* ===== COMMENTS ===== */
.comments{
  max-width:900px;
  margin:40px auto;
  padding:0 20px
}

textarea{
  width:100%;
  padding:14px;
  border-radius:12px;
  background:#020617;
  border:1px solid rgba(255,255,255,.1);
  color:#fff;
  margin-bottom:10px
}

button{
  padding:10px 18px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  background:#6366f1;
  color:#fff
}

.comment{
  background:#020617;
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  padding:16px;
  margin-bottom:14px
}

.comment-head{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.comment-user{
  display:flex;
  gap:8px;
  align-items:center
}

.admin-badge{
  font-size:11px;
  padding:3px 8px;
  border-radius:999px;
  background:linear-gradient(135deg,#facc15,#f59e0b,#d97706);
  color:#000;
  font-weight:700
}

.reply{
  margin-left:24px;
  margin-top:10px;
  padding:12px;
  background:#030712;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.08)
}

/* HOME BUTTON – PREMIUM */
.home-btn{
  position: fixed;                 /* stays visible */
  top: 22px;
  left: 28px;
  display: flex;
  align-items: center;
  gap: 10px;

  padding: 12px 18px;
  border-radius: 14px;

  text-decoration: none;
  text-transform: uppercase;

  font-family: "Inter", system-ui, sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 2px;

  color: #ffffff;

  background: linear-gradient(
    135deg,
    rgba(20,22,40,0.85),
    rgba(8,10,24,0.9)
  );

  border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(14px);

  box-shadow:
    0 18px 50px rgba(0,0,0,0.6),
    inset 0 0 0 1px rgba(255,255,255,0.04);

  transition: 
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease,
    color .25s ease;

  z-index: 999;
}

/* ICON */
.home-btn .home-icon{
  font-size: 14px;
  opacity: 0.85;
  transition: transform .25s ease;
}

/* HOVER */
.home-btn:hover{
  transform: translateY(-2px);
  border-color: rgba(100,103,255,0.6);
  color: #6467ff;

  box-shadow:
    0 28px 90px rgba(0,0,0,0.75),
    0 0 40px rgba(100,103,255,0.35);
}

.home-btn:hover .home-icon{
  transform: translateX(-3px);
}

/* ACTIVE (CLICK) */
.home-btn:active{
  transform: translateY(0);
}
</style>
</head>

<body>

<!-- ================= VIEWER ================= -->
<div class="viewer">
  <model-viewer id="viewer"
    camera-controls
    auto-rotate
    exposure="1"
    shadow-intensity="1"
    style="width:100%;height:100%">
  </model-viewer>
</div>

<!-- ================= INFO BAR ================= -->
<div class="info-bar">
  <div class="meta">
    <h3 id="modelName"></h3>
    <p id="modelMeta"></p>
  </div>

  <div class="actions">
    <a href="models.html" class="home-btn">
  <span class="home-icon">←</span>
  <span class="home-text">Home</span>
</a>
    <button id="likeBtn">❤️ <span id="likeCount">0</span></button>
    <button id="downloadBtn">Download</button>
  </div>
</div>

<!-- ================= COMMENTS ================= -->
<div class="comments">
  <h2>Comments</h2>

  <textarea id="commentInput" placeholder="Login to comment" disabled></textarea>
  <button id="postBtn" disabled>Post</button>

  <div id="commentList"></div>
</div>

<!-- ================= SCRIPTS ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, updateDoc, increment,
  collection, addDoc, query, orderBy, onSnapshot,
  serverTimestamp, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

/* ================= CONFIG ================= */
const ADMIN_EMAILS = [
  "hrd9011@gmail.com",
  "gggonetaponetap@gmail.com",
  "sunnehsunnehjk@gmail.com"
];

/* ================= INIT ================= */
const app = initializeApp({
  apiKey: "AIzaSyBy5JEPEcplViq8AkK-_uY8JXU5iHUM6ns",
  authDomain: "top-notch-log-data.firebaseapp.com",
  projectId: "top-notch-log-data"
});

const db = getFirestore(app);
const auth = getAuth(app);

/* ================= ELEMENTS ================= */
const viewer = document.getElementById("viewer");
const modelName = document.getElementById("modelName");
const modelMeta = document.getElementById("modelMeta");
const downloadBtn = document.getElementById("downloadBtn");
const likeBtn = document.getElementById("likeBtn");
const commentInput = document.getElementById("commentInput");
const postBtn = document.getElementById("postBtn");
const commentList = document.getElementById("commentList");

/* ================= AUTH ================= */
let currentUser = null;

onAuthStateChanged(auth, async user => {
  currentUser = user;
  commentInput.disabled = !user;
  postBtn.disabled = !user;

  if (user) {
    const likeSnap = await getDoc(doc(db, "models", modelId, "likes", user.uid));
    if (likeSnap.exists()) {
      liked = true;
      likeBtn.classList.add("liked");
    }
  }
});

/* ================= MODEL LOAD ================= */
const modelId = new URLSearchParams(location.search).get("id");
if (!modelId) location.href = "models.html";

const modelRef = doc(db, "models", modelId);
const modelSnap = await getDoc(modelRef);
if (!modelSnap.exists()) location.href = "models.html";

const model = modelSnap.data();

/* ================= STORAGE ================= */
const storageSnap = await getDoc(doc(db, "settings", "storage"));
const r2Base = storageSnap.data().r2BaseUrl.replace(/\/$/, "");

/* ================= URLS ================= */
viewer.src = `${r2Base}/${model.modelFile}`;
const downloadUrl = `${r2Base}/${model.downloadFile}`;

/* ================= META ================= */
modelName.innerText = model.name;
modelMeta.innerText = `${model.game || ""} · ${model.category || ""}`;

/* ================= DOWNLOAD ================= */
downloadBtn.onclick = async () => {
  try {
    await updateDoc(modelRef, { downloadsCount: increment(1) });
    window.open(downloadUrl, "_blank");
  } catch (e) {
    console.error(e);
    alert("Download failed");
  }
};

/* ================= LIKES (INSTANT) ================= */
let liked = false;
let likes = model.likesCount || 0;

likeBtn.innerText = `❤️ ${likes}`;

likeBtn.onclick = async () => {
  if (!currentUser || liked) return;

  // instant UI
  liked = true;
  likes++;
  likeBtn.innerText = `❤️ ${likes}`;
  likeBtn.classList.add("liked");

  try {
    await updateDoc(modelRef, { likesCount: increment(1) });
    await setDoc(
      doc(db, "models", modelId, "likes", currentUser.uid),
      { likedAt: serverTimestamp() }
    );
  } catch (err) {
    // rollback
    liked = false;
    likes--;
    likeBtn.innerText = `❤️ ${likes}`;
    console.error(err);
  }
};

/* ================= COMMENTS ================= */
const commentsRef = collection(db, "models", modelId, "comments");

onSnapshot(query(commentsRef, orderBy("createdAt", "desc")), snap => {
  commentList.innerHTML = "";

  snap.forEach(docSnap => {
    const c = docSnap.data();
    const commentId = docSnap.id;
    const isAdmin = ADMIN_EMAILS.includes(c.userEmail);

    commentList.innerHTML += `
      <div class="comment">
        <div class="comment-head">
          <div class="comment-user">
            <b>${c.userEmail}</b>
            ${isAdmin ? `<span class="admin-badge">ADMIN</span>` : ""}
          </div>
        </div>

        <p>${c.text}</p>

        <button class="reply-btn" data-id="${commentId}">Reply</button>
        <div class="replies" id="replies-${commentId}"></div>
      </div>
    `;

    loadReplies(commentId);
  });
});

/* ================= LOAD REPLIES ================= */
function loadReplies(commentId) {
  const repliesRef = collection(
    db, "models", modelId, "comments", commentId, "replies"
  );

  onSnapshot(query(repliesRef, orderBy("createdAt")), snap => {
    const box = document.getElementById(`replies-${commentId}`);
    if (!box) return;

    box.innerHTML = "";
    snap.forEach(r => {
      const d = r.data();
      box.innerHTML += `
        <div class="reply">
          <b>${d.userEmail}</b>: ${d.text}
        </div>
      `;
    });
  });
}

/* ================= POST COMMENT ================= */
postBtn.onclick = async () => {
  if (!currentUser) return alert("Login required");

  const text = commentInput.value.trim();
  if (!text) return;

  await addDoc(commentsRef, {
    text,
    userEmail: currentUser.email,
    createdAt: serverTimestamp()
  });

  commentInput.value = "";
};

/* ================= POST REPLY ================= */
document.addEventListener("click", async e => {
  if (!e.target.classList.contains("reply-btn")) return;
  if (!currentUser) return alert("Login required");

  const commentId = e.target.dataset.id;
  const text = prompt("Reply:");
  if (!text) return;

  await addDoc(
    collection(db, "models", modelId, "comments", commentId, "replies"),
    {
      text,
      userEmail: currentUser.email,
      createdAt: serverTimestamp()
    }
  );
});
</script>


<script type="module"
 src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

</body>
</html>
