<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="/logo.ico">
<meta charset="UTF-8">
<title>Model Preview | TopNotch Assets</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Inter,system-ui,sans-serif;
}

/* ===== VIEWER ===== */
.viewer{height:75vh;background:#000}

/* ===== INFO BAR ===== */
.info-bar{
  height:90px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px;
  background:#020617;
  border-top:1px solid rgba(255,255,255,.08)
}

.meta h3{margin:0;font-size:20px}
.meta p{margin:4px 0 0;color:#94a3b8}

/* ===== ACTIONS ===== */
.actions{
  display:flex;
  gap:12px;
  align-items:center;
}

.action-btn{
  padding:12px 28px;
  border-radius:999px;
  border:none;
  font-weight:700;
  cursor:pointer;
}

#downloadBtn{
  background:linear-gradient(90deg,#00eaff,#6f7bff);
  color:#000;
}

#likeBtn{
  background:#111827;
  color:#fff;
  border:1px solid rgba(255,255,255,.15);
}

/* ===== COMMENTS ===== */
.comments{
  max-width:900px;
  margin:40px auto;
  padding:0 20px
}

textarea{
  width:100%;
  padding:14px;
  border-radius:12px;
  background:#020617;
  border:1px solid rgba(255,255,255,.1);
  color:#fff;
  margin-bottom:10px
}

button{
  padding:10px 18px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  background:#6366f1;
  color:#fff
}

.comment{
  background:#020617;
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  padding:16px;
  margin-bottom:14px
}

.comment-head{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.comment-user{
  display:flex;
  gap:8px;
  align-items:center
}

.admin-badge{
  font-size:11px;
  padding:3px 8px;
  border-radius:999px;
  background:linear-gradient(135deg,#facc15,#f59e0b,#d97706);
  color:#000;
  font-weight:700
}

.reply{
  margin-left:24px;
  margin-top:10px;
  padding:12px;
  background:#030712;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.08)
}
</style>
</head>

<body>

<!-- ================= VIEWER ================= -->
<div class="viewer">
  <model-viewer id="viewer"
    camera-controls
    auto-rotate
    exposure="1"
    shadow-intensity="1"
    style="width:100%;height:100%">
  </model-viewer>
</div>

<!-- ================= INFO BAR ================= -->
<div class="info-bar">
  <div class="meta">
    <h3 id="modelName"></h3>
    <p id="modelMeta"></p>
  </div>

  <div class="actions">
    <button id="likeBtn">❤️ <span id="likeCount">0</span></button>
    <button id="downloadBtn">Download</button>
  </div>
</div>

<!-- ================= COMMENTS ================= -->
<div class="comments">
  <h2>Comments</h2>

  <textarea id="commentInput" placeholder="Login to comment" disabled></textarea>
  <button id="postBtn" disabled>Post</button>

  <div id="commentList"></div>
</div>

<!-- ================= SCRIPTS ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, updateDoc, increment,
  collection, addDoc, query, orderBy, onSnapshot,
  serverTimestamp, setDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

/* ===== CONFIG ===== */
const ADMIN_EMAILS = [
  "hrd9011@gmail.com",
  "gggonetaponetap@gmail.com",
  "sunnehsunnehjk@gmail.com"
];

/* ===== INIT ===== */
const app = initializeApp({
  apiKey: "AIzaSyBy5JEPEcplViq8AkK-_uY8JXU5iHUM6ns",
  authDomain: "top-notch-log-data.firebaseapp.com",
  projectId: "top-notch-log-data"
});

const db = getFirestore(app);
const auth = getAuth(app);

/* ===== AUTH ===== */
let currentUser = null;
onAuthStateChanged(auth, user => {
  currentUser = user;
  commentInput.disabled = !user;
  postBtn.disabled = !user;
});

/* ===== MODEL LOAD ===== */
const id = new URLSearchParams(location.search).get("id");
const modelRef = doc(db,"models",id);
const modelSnap = await getDoc(modelRef);
if(!modelSnap.exists()) location.href="models.html";

const model = modelSnap.data();

/* ===== STORAGE ===== */
const storageSnap = await getDoc(doc(db,"settings","storage"));
const r2Base = storageSnap.data().r2BaseUrl.replace(/\/$/,"");

/* ===== URLs ===== */
viewer.src = `${r2Base}/${model.modelFile}`;
const downloadUrl = `${r2Base}/${model.downloadFile}`;

/* ===== META ===== */
modelName.innerText = model.name;
modelMeta.innerText = `${model.game} · ${model.category}`;
likeCount.innerText = model.likesCount || 0;

/* ===== DOWNLOAD ===== */
downloadBtn.onclick = async ()=>{
  await updateDoc(modelRef,{downloadsCount:increment(1)});
  window.open(downloadUrl,"_blank");
};

/* ===== LIKES ===== */
if(currentUser){
  const likeRef = doc(db,"models",id,"likes",currentUser.uid);
  const likeSnap = await getDoc(likeRef);
  if(likeSnap.exists()) likeBtn.style.opacity=.5;

  likeBtn.onclick = async ()=>{
    if((await getDoc(likeRef)).exists()){
      await deleteDoc(likeRef);
      await updateDoc(modelRef,{likesCount:increment(-1)});
    }else{
      await setDoc(likeRef,{createdAt:serverTimestamp()});
      await updateDoc(modelRef,{likesCount:increment(1)});
    }
  };
}

/* ===== COMMENTS ===== */
const commentsRef = collection(db,"models",id,"comments");
onSnapshot(query(commentsRef,orderBy("createdAt","desc")),snap=>{
  commentList.innerHTML="";
  snap.forEach(cDoc=>{
    const c=cDoc.data();
    const admin = ADMIN_EMAILS.includes(c.userEmail);
    commentList.innerHTML+=`
      <div class="comment">
        <div class="comment-head">
          <div class="comment-user">
            <b>${c.userEmail}</b>
            ${admin?'<span class="admin-badge">ADMIN</span>':''}
          </div>
        </div>
        <p>${c.text}</p>
      </div>`;
  });
});

/* ===== POST COMMENT ===== */
postBtn.onclick = async ()=>{
  if(!currentUser) return;
  const text=commentInput.value.trim();
  if(!text) return;
  await addDoc(commentsRef,{
    text,
    userEmail:currentUser.email,
    createdAt:serverTimestamp()
  });
  commentInput.value="";
};
</script>

<script type="module"
 src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

</body>
</html>
